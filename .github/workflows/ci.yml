name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13', '24', '26']
    steps:
      # Actions are pinned to commit SHAs; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: Unit, adversarial and CLI tests (no network)
        run: npm test
      - name: Namespace documents are current
        run: |
          node scripts/build-vocab-docs.mjs
          git diff --exit-code -- docs/ns
      - name: Packed tarball works with no peers installed
        run: node scripts/smoke-pack.mjs
      # The published package has no runtime dependencies, so this covers the
      # package alone. Optional peers are audited by whoever installs them.
      - name: Audit runtime dependencies (none)
        run: npm audit --omit=dev --omit=peer
