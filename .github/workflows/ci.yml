name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13', '24', '26']
    steps:
      # Actions are pinned to commit SHAs; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # No dependency install script runs in CI: the suite needs none (it imports
      # only n3 and the MCP SDK, both plain JavaScript), and a compromised
      # dependency's install script would otherwise run with the checkout.
      - run: npm ci --ignore-scripts
      - name: Unit, adversarial and CLI tests (no network)
        run: npm test
      - name: Namespace documents are current
        run: |
          node scripts/build-vocab-docs.mjs
          # git diff alone ignores untracked files, so a new version directory
          # nobody committed (the ontology's versionIRI) would pass. Porcelain
          # status lists modified and untracked paths alike.
          changes="$(git status --porcelain --untracked-files=all -- docs/ns)"
          if [ -n "$changes" ]; then
            echo "docs/ns is not what scripts/build-vocab-docs.mjs generates; run it and commit:"
            echo "$changes"
            git diff -- docs/ns
            exit 1
          fi
      - name: Packed tarball works with no peers installed
        run: node scripts/smoke-pack.mjs
      # The published package has no runtime dependencies, so this covers the
      # package alone. Optional peers are audited by whoever installs them.
      - name: Audit runtime dependencies (none)
        run: npm audit --omit=dev --omit=peer

  # Removing a security guard must turn CI red. Each mutant in
  # scripts/mutations.json deletes or weakens one guard in a temporary copy of
  # the repository; the job fails if the tests still pass for any of them.
  mutation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # About 300 mutants; most runs take seconds.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Every security guard is protected by a failing test
        # A hang is reported as TIMEOUT and fails the job, never counted as a kill,
        # so there is no reason to wait the default five minutes for one.
        run: npm run test:mutation -- --timeout-ms 120000
