name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Namespace documents are current
        run: |
          node scripts/build-vocab-docs.mjs
          git diff --exit-code -- docs/ns
      - name: Packed tarball works with no peers installed
        run: node scripts/smoke-pack.mjs
      - name: Production dependency audit
        run: npm audit --omit=dev
