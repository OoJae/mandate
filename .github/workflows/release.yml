name: release

# Publishes to npm from a version tag, with provenance, through npm trusted
# publishing: the npm package lists this workflow as its trusted publisher, so no
# token is stored anywhere.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No dependency cache in a publishing job.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm ci
      - run: npm test
      - run: node scripts/smoke-pack.mjs
      - name: npm new enough for trusted publishing
        run: npm install -g npm@^11.5.1
      - run: npm publish --provenance --access public
