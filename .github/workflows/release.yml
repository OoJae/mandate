name: release

# Publishes to npm from a version tag, with provenance, through npm trusted
# publishing: the npm package lists this workflow as its trusted publisher, so no
# token is stored anywhere.
#
# Two jobs, so that no third-party code ever runs where a publish token can be
# minted. `pack` installs the dev dependencies (whose install scripts run), tests
# and packs, with no id-token permission. `publish` holds id-token, runs in the
# protected `npm` environment, installs nothing from the project, and publishes
# the exact tarball `pack` produced after checking its digest.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      # Actions are pinned to commit SHAs; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache in a release build.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm ci
      - run: npm test
      - run: node scripts/smoke-pack.mjs
      - name: Pack
        id: pack
        run: |
          mkdir dist
          npm pack --pack-destination dist
          tarball="$(cd dist && ls *.tgz)"
          test "$(ls dist/*.tgz | wc -l)" = 1
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "dist/${tarball}" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: pack
    runs-on: ubuntu-latest
    # Protected environment: set required reviewers on it in the repository
    # settings, and name it in the npm trusted publisher configuration.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: dist
      - name: Tarball is the one pack produced
        env:
          TARBALL: ${{ needs.pack.outputs.tarball }}
          SHA256: ${{ needs.pack.outputs.sha256 }}
        run: echo "${SHA256}  dist/${TARBALL}" | sha256sum --check --strict
      # Trusted publishing needs npm 11.5.1 or later. Pinned exactly, and npm
      # itself has no install scripts; --ignore-scripts keeps it that way.
      - name: npm, pinned
        run: npm install --global --ignore-scripts npm@11.19.1
      - name: Publish
        env:
          TARBALL: ${{ needs.pack.outputs.tarball }}
        run: npm publish "dist/${TARBALL}" --provenance --access public
